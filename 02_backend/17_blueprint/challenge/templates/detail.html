{% extends "base.html" %}

{% block title %}{{ title }} - メモ帳{% endblock %}

{% block content %}
<article class="detail">
    <span class="tag">{{ category }}</span>
    <h1>{{ title }}</h1>
    <p>{{ body }}</p>
    {% if due_date %}
    <dl class="detail-meta">
        <dt>期限</dt>
        <dd><time datetime="{{ due_date }}">{{ due_date }}</time></dd>
    </dl>
    {% endif %}
    <a class="back-link" href="/">メモ一覧へ戻る</a>
</article>
{% endblock %}
