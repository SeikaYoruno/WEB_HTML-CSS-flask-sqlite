<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>セマンティックHTML</title>
    <style>
        /* 各領域がどのタグかわかるように、枠線とラベルを付けている（学習用の見た目） */
        header, nav, main, article, section, aside, footer, figure {
            display: block;
            border: 2px dashed #9aa5b8;
            margin: 8px 0;
            padding: 8px 12px;
        }

        header::before, nav::before, main::before, article::before,
        section::before, aside::before, footer::before, figure::before {
            display: block;
            font: bold 12px monospace;
            color: #3f6fd1;
        }

        header::before  { content: "<header>"; }
        nav::before     { content: "<nav>"; }
        main::before    { content: "<main>"; }
        article::before { content: "<article>"; }
        section::before { content: "<section>"; }
        aside::before   { content: "<aside>"; }
        footer::before  { content: "<footer>"; }
        figure::before  { content: "<figure>"; }
    </style>
</head>
<body>
    <!-- header：ページ（または記事）の導入部分。サイト名やナビゲーションを置く -->
    <header>
        <p><strong>メモ帳ブログ</strong></p>

        <!-- nav：主要なナビゲーション（サイト内の移動用リンクのまとまり） -->
        <nav>
            <ul>
                <li><a href="#">ホーム</a></li>
                <li><a href="#">記事一覧</a></li>
                <li><a href="#">このサイトについて</a></li>
            </ul>
        </nav>
    </header>

    <!-- main：そのページの主な内容。1ページに1つだけ -->
    <main>
        <!-- article：それ単体で完結する内容（ブログ記事・ニュース・1件のメモカードなど） -->
        <article>
            <h1>メモを習慣にするコツ</h1>
            <!-- time：日時。datetime属性に機械が読める形式で書く -->
            <p>公開日：<time datetime="2026-10-01">2026年10月1日</time></p>

            <!-- section：見出しを持つ、内容のまとまり（章・節） -->
            <section>
                <h2>1. 書く場所を1つに決める</h2>
                <p>メモがあちこちに散らばると、見返さなくなります。</p>
            </section>

            <section>
                <h2>2. カテゴリを付ける</h2>
                <p>あとで探しやすくなります。</p>

                <!-- figure / figcaption：図とその説明をセットにする -->
                <figure>
                    <img src="img/sample.png" alt="カテゴリごとに色分けされたメモカードの例" width="120" height="120">
                    <figcaption>図1：カテゴリで色分けしたメモ</figcaption>
                </figure>
            </section>
        </article>

        <!-- aside：本文と関連はあるが、なくても成り立つ補足（サイドバー・関連リンクなど） -->
        <aside>
            <h2>関連記事</h2>
            <ul>
                <li><a href="#">買い物リストの作り方</a></li>
            </ul>
        </aside>
    </main>

    <!-- footer：ページ（または記事）の締めくくり。著作権表示や問い合わせ先など -->
    <footer>
        <p><small>&copy; 2026 メモ帳ブログ</small></p>
    </footer>
</body>
</html>
