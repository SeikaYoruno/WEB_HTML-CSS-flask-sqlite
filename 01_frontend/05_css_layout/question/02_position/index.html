<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>問題2：positionで重ねる・固定する</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: sans-serif;
            margin: 0;
            color: #262b33;
            background: #f4f6f9;
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 24px 16px 800px;   /* 下に余白を作ってスクロールできるようにしている */
        }

        /* ===== (1) 固定ヘッダー ===== */
        .site-header {
            background: #3f6fd1;
            color: #ffffff;
            padding: 12px 24px;
            /* TODO 1 */
        }

        /* ===== (2) 閉じるボタン付きのお知らせ ===== */
        .notice {
            background: #ffffff;
            border: 1px solid #c8ced8;
            border-radius: 8px;
            padding: 12px 48px 12px 16px;   /* 右側は × ボタンの分だけ空けておく */
            /* TODO 2 */
        }

        .close {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 50%;
            background: #e1e5eb;
            cursor: pointer;
            /* TODO 3 */
        }

        /* ===== (3) NEW バッジ付きのカード ===== */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 24px;
            margin-top: 24px;
        }

        .card {
            height: 120px;
            padding: 16px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 1px 3px rgb(0 0 0 / 0.1);
            /* TODO 4 */
        }

        .badge {
            padding: 2px 10px;
            border-radius: 999px;
            background: #d1723f;
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: bold;
            /* TODO 5 */
        }

        /* ===== (4) トップへ戻るボタン ===== */
        .to-top {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #2f9e44;
            color: #ffffff;
            text-decoration: none;
            font-size: 1.25rem;
            /* TODO 6 */
        }
    </style>
</head>
<body id="top">
    <header class="site-header">
        <strong>メモ帳</strong>
    </header>

    <main>
        <div class="notice">
            お知らせ：新機能を追加しました
            <button type="button" class="close" aria-label="お知らせを閉じる">×</button>
        </div>

        <div class="cards">
            <article class="card">
                <h2>買い物リスト</h2>
                <span class="badge">NEW</span>
            </article>
            <article class="card">
                <h2>企画会議メモ</h2>
            </article>
            <article class="card">
                <h2>読書メモ</h2>
                <span class="badge">NEW</span>
            </article>
        </div>
    </main>

    <a href="#top" class="to-top" aria-label="ページの先頭へ戻る">↑</a>
</body>
</html>
