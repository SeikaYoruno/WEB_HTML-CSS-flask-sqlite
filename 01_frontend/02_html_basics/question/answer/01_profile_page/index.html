<!doctype html>
<!-- 条件1：上の1行目が doctype 宣言。無いとブラウザが古い互換モードで表示する -->
<!-- 条件2：lang="ja" で日本語の文書であることを伝える（読み上げ・翻訳・フォント選択に使われる） -->
<html lang="ja">
<head>
    <!-- 条件3：head はページの設定情報。画面には表示されない -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Web開発を学習中の山田太郎の自己紹介ページです。">
    <title>自己紹介 | 山田 太郎</title>
</head>
<body>
    <h1>山田 太郎の自己紹介</h1>

    <!-- 条件6：ソース上の改行は、画面では空白1つにまとめられる（日本語の場合は空白もほぼ目立たない） -->
    <p>
        はじめまして。
        Webアプリ開発を勉強しています。
    </p>

    <!-- 条件4：後に開いたもの（em）から先に閉じる -->
    <p>今の目標は<strong><em>自分のホームページを公開すること</em></strong>です。</p>

    <!-- 条件5：< と > をそのまま書くと、ブラウザが本物の h1 タグだと解釈してしまう -->
    <p>好きなタグは &lt;h1&gt; です。</p>

    <p>&copy; 2026 山田 太郎</p>
</body>
</html>
