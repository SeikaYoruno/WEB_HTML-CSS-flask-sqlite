<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>1. DOM操作</title>
    <style>
        body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #262b33; }
        section { border: 1px solid #e1e5eb; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; }
        textarea, input[type="text"] { width: 100%; box-sizing: border-box; padding: 6px; }
        textarea { height: 100px; }
        #count { color: #6b7280; font-size: 0.9em; }
        #count.over { color: #d1495b; font-weight: bold; }
        .memo-list li { margin-bottom: 4px; }
        .tag { display: inline-block; font-size: 0.75em; background: #e8edfb; color: #3f6fd1; padding: 0 8px; border-radius: 999px; margin-right: 6px; }
        .output { background: #f4f6f9; padding: 8px; border-radius: 4px; min-height: 1.5em; }
    </style>
</head>
<body>
    <h1>DOM操作</h1>

    <section>
        <h2>1. 要素を取得して書き換える（文字数カウンター）</h2>
        <textarea id="body" maxlength="500" placeholder="ここに入力..."></textarea>
        <p><span id="count">0</span> / 500文字</p>
    </section>

    <section>
        <h2>2. querySelector と属性の読み書き</h2>
        <p>
            <a class="doc-link" href="https://developer.mozilla.org/ja/" data-lang="ja">MDN（日本語）</a>
        </p>
        <p class="output" id="attr-output"></p>
    </section>

    <section>
        <h2>3. 要素を作って追加する</h2>
        <ul class="memo-list" id="memo-list"></ul>
    </section>

    <section>
        <h2>4. textContent と innerHTML の違い</h2>
        <p>script.js の userInput（img タグに onerror を付けた文字列）を、2つの方法で画面に表示します。</p>
        <p>textContent：</p>
        <p class="output" id="safe-output"></p>
        <p>innerHTML（危険）：</p>
        <p class="output" id="danger-output"></p>
    </section>

    <script src="script.js"></script>
</body>
</html>
