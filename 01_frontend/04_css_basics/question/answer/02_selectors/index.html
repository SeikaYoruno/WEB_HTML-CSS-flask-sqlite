<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>解答2：セレクタを書く</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 640px;
            margin: 24px auto;
            padding: 0 16px;
        }

        /* (1) グループ化：カンマで区切ると、どちらにも同じスタイルが当たる */
        h1, h2 {
            color: #3f6fd1;
        }

        /* (2) 子結合子 > ：直下の子だけ。.memo p（子孫）にすると .memo-body の中の p まで当たってしまう */
        .memo > p {
            color: #6b7280;
            font-size: 0.85rem;
        }

        /* (3) 隣接兄弟結合子 + ：直後の1つだけ。h2 ~ p（一般兄弟）にすると、後ろの p すべてに当たる */
        h2 + p {
            font-weight: bold;
        }

        /* (4) 複数クラス：間にスペースを入れない。.tag .active（スペースあり）だと「.tag の中の .active」になる */
        .tag.active {
            background: #3f6fd1;
            color: #ffffff;
        }

        /* (5) 属性セレクタ ^= ：〜で始まる */
        a[href^="https://"] {
            color: #d1723f;
        }

        /* (6) 属性セレクタ $= ：〜で終わる ＋ 疑似要素 ::after：中身の後ろに追加する */
        a[href$=".pdf"]::after {
            content: "（PDF）";
        }

        /* (7) 疑似クラス :nth-child(even)：偶数番目 */
        .todo li:nth-child(even) {
            background: #f4f6f9;
        }

        /* (8) 疑似クラス :not()：〜を持たない */
        .todo li:not(.done) {
            border-left: 4px solid #3f6fd1;
            padding-left: 8px;
        }

        /* (9) :checked（チェックされている）と、隣接兄弟結合子 + の組み合わせ */
        input:checked + label {
            text-decoration: line-through;
            color: #6b7280;
        }

        /* (10) 属性セレクタ：属性を持っているかどうかだけで選ぶ */
        input[required] {
            border: 2px solid #d1723f;
        }

        /* (11) 疑似クラス :hover：マウスが乗っているとき */
        .todo li:hover {
            background: #e8edfb;
        }

        /* 以下は問題ではない（見た目を整えるだけ） */
        .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; background: #e1e5eb; font-size: 0.8rem; }
        .todo { list-style: none; padding: 0; }
        .todo li { padding: 6px 12px; }
        .memo { border: 1px solid #e1e5eb; border-radius: 8px; padding: 12px 16px; }
    </style>
</head>
<body>
    <h1>メモの詳細</h1>

    <div class="memo">
        <p>作成日：2026年10月1日</p>
        <p>更新日：2026年10月3日</p>
        <div class="memo-body">
            <p>本文の段落です。.memo の直下ではなく、.memo-body の中にあります。</p>
        </div>
        <span class="tag active">仕事</span>
        <span class="tag">家事</span>
        <span class="tag">趣味</span>
    </div>

    <h2>リンク</h2>
    <p>このメモで参考にしたページです。</p>
    <p>
        <a href="https://developer.mozilla.org/ja/">MDN Web Docs</a> ／
        <a href="memo-list.html">メモ一覧へ</a> ／
        <a href="terms.pdf">利用規約</a>
    </p>

    <h2>やること</h2>
    <p>終わったものにはチェックを付けます。</p>
    <ul class="todo">
        <li class="done">資料を集める</li>
        <li>下書きを書く</li>
        <li>見直す</li>
        <li class="done">先輩に相談する</li>
        <li>提出する</li>
    </ul>

    <h2>チェックリスト</h2>
    <p>チェックを付けると、ラベルに取り消し線が付きます。</p>
    <p>
        <input type="checkbox" id="c1" checked><label for="c1">牛乳を買う</label><br>
        <input type="checkbox" id="c2"><label for="c2">卵を買う</label>
    </p>

    <h2>メモを追加</h2>
    <p>タイトルは必須です。</p>
    <p>
        <label>タイトル <input type="text" required></label>
        <label>メモ <input type="text"></label>
    </p>
</body>
</html>
