<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSS変数とトランジション</title>
    <style>
        /* ===== 1. CSS変数（カスタムプロパティ） ===== */
        /* :root（= html要素）に定義すると、ページ全体で使える */
        :root {
            --color-bg: #f4f6f9;
            --color-surface: #ffffff;
            --color-primary: #3f6fd1;
            --color-text: #262b33;
            --color-muted: #6b7280;
            --color-border: #e1e5eb;
            --radius: 8px;
            --space: 16px;
        }

        /* ===== 2. ダークモード：OSの設定が「ダーク」のときは変数だけを差し替える ===== */
        @media (prefers-color-scheme: dark) {
            :root {
                --color-bg: #16181d;
                --color-surface: #22262e;
                --color-primary: #7ea2f0;
                --color-text: #e6e8ec;
                --color-muted: #a0a7b4;
                --color-border: #343a46;
            }
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            margin: 0;
            padding: 24px;
            background: var(--color-bg);       /* var(--名前) で値を使う */
            color: var(--color-text);
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: var(--space);
        }

        .card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: var(--space);

            /* ===== 3. トランジション：プロパティの変化をなめらかにする ===== */
            /* transition: 対象プロパティ 時間 イージング */
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);                   /* 4px 上に浮かせる */
            box-shadow: 0 8px 20px rgb(0 0 0 / 0.12);
        }

        .card p {
            color: var(--color-muted);
            margin-bottom: 0;
        }

        /* 変数は要素ごとに上書きできる。.card.accent の中だけ --color-primary が変わる */
        .card.accent {
            --color-primary: #d1723f;
            border-top: 4px solid var(--color-primary);
        }

        .button {
            display: inline-block;
            margin-top: 12px;
            padding: 8px 16px;
            background: var(--color-primary);
            color: #ffffff;
            border: none;
            border-radius: 999px;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.1s;
        }

        .button:hover {
            opacity: 0.85;
        }

        .button:active {
            transform: scale(0.96);   /* 押した瞬間に少し縮む */
        }

        /* ===== 4. アニメーションを減らす設定のユーザーには動きを止める（アクセシビリティ） ===== */
        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <h1>CSS変数とトランジション</h1>
    <p>カードにマウスを乗せると浮き上がります。OSをダークモードにすると配色が切り替わります。</p>

    <div class="card-grid">
        <div class="card">
            <h2>CSS変数</h2>
            <p>色や余白を1か所で管理できる。変更が1行で済む。</p>
            <a href="#" class="button">ボタン</a>
        </div>
        <div class="card accent">
            <h2>変数の上書き</h2>
            <p>このカードの中だけ --color-primary を橙色に上書きしている。</p>
            <a href="#" class="button">ボタン</a>
        </div>
        <div class="card">
            <h2>トランジション</h2>
            <p>transition を付けると、:hover の変化がなめらかになる。</p>
            <a href="#" class="button">ボタン</a>
        </div>
    </div>
</body>
</html>
