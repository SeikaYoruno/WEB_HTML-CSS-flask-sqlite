<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>position</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            margin: 0;
            color: #262b33;
        }

        main {
            padding: 0 24px 400px;    /* 下に余白を作ってスクロールできるようにしている */
        }

        /* ===== sticky：スクロールしても画面上端に貼り付く ===== */
        .sticky-header {
            position: sticky;
            top: 0;                   /* 画面上端から 0px の位置で貼り付く */
            z-index: 10;              /* 重なり順。大きいほど手前に表示される */
            background: #3f6fd1;
            color: #ffffff;
            padding: 12px 24px;
        }

        .demo {
            background: #f4f6f9;
            border: 1px dashed #9aa5b8;
            padding: 16px;
            margin-bottom: 24px;
            height: 140px;
        }

        .box {
            width: 140px;
            padding: 8px;
            background: #e8edfb;
            border: 2px solid #3f6fd1;
        }

        /* ===== relative：元の位置を基準にずらす（元の場所は空いたまま） ===== */
        .relative {
            position: relative;
            top: 20px;
            left: 40px;
        }

        /* ===== absolute：「position が指定された一番近い祖先」を基準に配置する ===== */
        .parent {
            position: relative;       /* ← 子の absolute の基準になる（ずらさないのでこれ自体は動かない） */
        }

        .absolute {
            position: absolute;
            right: 16px;
            bottom: 16px;
            background: #fff3ee;
            border-color: #d1723f;
        }

        /* 実用例：カードの右上にバッジを重ねる */
        .card {
            position: relative;
            width: 220px;
            padding: 16px;
            background: #ffffff;
            border: 1px solid #e1e5eb;
            border-radius: 8px;
            box-shadow: 0 1px 3px rgb(0 0 0 / 0.08);
        }

        .badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #d1723f;
            color: #ffffff;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 999px;
        }

        /* ===== fixed：画面（ビューポート）を基準に固定。スクロールしても動かない ===== */
        .fixed-button {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 20;
            background: #2f9e44;
            color: #ffffff;
            border: none;
            border-radius: 999px;
            padding: 12px 20px;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgb(0 0 0 / 0.2);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header class="sticky-header">
        <strong>position: sticky</strong>（スクロールしても上に残る）
    </header>

    <main>
        <h1>position</h1>

        <h2>static（デフォルト）</h2>
        <div class="demo">
            <div class="box">通常の位置。top/left は効かない</div>
        </div>

        <h2>relative</h2>
        <div class="demo">
            <div class="box relative">top: 20px; left: 40px; でずれる</div>
            <p>元の場所は空いたまま（後ろの要素は詰めてこない）</p>
        </div>

        <h2>absolute</h2>
        <div class="demo parent">
            親に position: relative
            <div class="box absolute">親の右下から 16px</div>
        </div>

        <h2>実用例：バッジ</h2>
        <div class="card">
            <span class="badge">NEW</span>
            <strong>買い物リスト</strong>
            <p>右上の「NEW」は absolute で重ねています。</p>
        </div>

        <h2>fixed</h2>
        <p>右下の緑のボタンは、スクロールしても画面の同じ位置に表示され続けます。</p>
    </main>

    <button type="button" class="fixed-button">＋ 新規メモ</button>
</body>
</html>
