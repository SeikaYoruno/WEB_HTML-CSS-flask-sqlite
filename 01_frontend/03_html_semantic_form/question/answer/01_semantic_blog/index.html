<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>解答1：セマンティックHTML</title>
    <style>
        body { font-family: sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; }
        .header { background: #3f6fd1; color: #fff; padding: 12px 16px; border-radius: 8px; }
        .nav a { color: #fff; margin-right: 12px; }
        .nav ul { list-style: none; padding: 0; margin: 8px 0 0; display: flex; gap: 12px; }
        .post-title { font-size: 1.8rem; font-weight: bold; margin: 24px 0 4px; }
        .post-heading { font-size: 1.3rem; font-weight: bold; margin: 16px 0 4px; }
        .side { background: #f4f6f9; padding: 12px; border-radius: 8px; margin-top: 24px; }
        .footer { text-align: center; color: #6b7280; margin-top: 24px; font-size: 0.85rem; }
    </style>
</head>
<body>
    <!-- 1. header -->
    <header class="header">
        <!-- サイト名は見出しではないので p + strong（h1 は記事タイトルに使う） -->
        <p><strong>メモ帳ブログ</strong></p>

        <!-- 2. nav + ul/li：リンクの「まとまり」はリストで表す -->
        <nav class="nav">
            <ul>
                <li><a href="#">ホーム</a></li>
                <li><a href="#">記事一覧</a></li>
            </ul>
        </nav>
    </header>

    <!-- 3. main：ページの主要な内容（1ページに1つ） -->
    <main class="main">
        <!-- 4. article：単体で完結する記事 -->
        <article class="post">
            <!-- 5. ページで1つの h1 -->
            <h1 class="post-title">メモを習慣にするコツ</h1>
            <!-- 7. time 要素 -->
            <p><time datetime="2026-10-01">2026年10月1日</time></p>

            <!-- 6. section + h2 -->
            <section>
                <h2 class="post-heading">書く場所を1つに決める</h2>
                <!-- 10. 意味として「重要」なので strong（b は意味を持たない太字） -->
                <p>メモがあちこちに散らばると見返さなくなります。これが<strong>とても大事</strong>です。</p>
            </section>

            <section>
                <h2 class="post-heading">カテゴリを付ける</h2>
                <p>あとで探しやすくなります。</p>
                <!-- 11. alt には「何が写っているか」を書く -->
                <img src="img/sample.png" alt="カテゴリごとに色分けされたメモの例" width="120" height="120">
            </section>
        </article>

        <!-- 8. aside：本文の補足 -->
        <aside class="side">
            <h2>関連記事</h2>
            <ul>
                <li><a href="#">買い物リストの作り方</a></li>
            </ul>
        </aside>
    </main>

    <!-- 9. footer -->
    <footer class="footer">
        <p><small>&copy; 2026 メモ帳ブログ</small></p>
    </footer>
</body>
</html>
