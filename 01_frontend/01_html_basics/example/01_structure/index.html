<!doctype html>
<!-- ↑ 「このファイルはHTML5です」という宣言。必ず1行目に書く -->

<!-- html要素：文書全体の根っこ（ルート要素）。lang属性でページの言語を伝える -->
<html lang="ja">

<!-- head：ページの「設定情報」。ここに書いた内容は画面には表示されない -->
<head>
    <!-- 文字コード。これが無いと日本語が文字化けすることがある -->
    <meta charset="UTF-8">

    <!-- スマホで正しい幅で表示するための指定（04_css_layout「4. レスポンシブ対応」で詳しく学ぶ） -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- ブラウザのタブに表示されるタイトル -->
    <title>HTML文書の骨組み</title>
</head>

<!-- body：実際に画面に表示される内容 -->
<body>
    <h1>HTML文書の骨組み</h1>

    <!--
        要素 = 開始タグ + 内容 + 終了タグ
        <p>        ... 開始タグ
        こんにちは  ... 内容
        </p>       ... 終了タグ
    -->
    <p>こんにちは。これは<strong>段落（p要素）</strong>です。</p>

    <!-- 属性：開始タグの中に「名前="値"」の形で追加情報を書く -->
    <p title="マウスを乗せると表示される補足">この段落にマウスを乗せてみてください（title属性）。</p>

    <!-- 空要素：内容を持たないので終了タグが無い（br, img, input, meta など） -->
    <p>1行目<br>2行目（br要素で改行）</p>

    <!-- 入れ子：要素の中に要素を入れられる。閉じる順番は「後に開いたものから先に閉じる」 -->
    <p>正しい入れ子：<strong>太字の中に<em>強調</em></strong></p>

    <!--
        HTMLでは連続する空白や改行は1つの空白にまとめられる。
        下の段落はソース上は改行しているが、ブラウザでは1行で表示される。
    -->
    <p>
        ソースでは
        改行しているのに
        1行で表示される
    </p>

    <!-- 文字参照：© のようなキーボードで打ちにくい記号は、&copy; のように書いて表示する -->
    <p>&copy; コピーライト</p>
</body>
</html>
